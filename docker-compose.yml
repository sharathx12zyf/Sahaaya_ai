# One command:  docker compose up --build    ->  app: http://localhost:8000   sample dashboard: http://localhost:9000
# Works WITHOUT keys (shows "key not set"). For AI + voice, copy .env.example to .env and add your keys.
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_DASHBOARD_URL: http://dashboard:9000          # how the app reaches the sample dashboard
      DEMO_DASHBOARD_PUBLIC_URL: http://localhost:9000   # link shown in the browser
      DEMO_DASHBOARD_KEY: demo-key-123
      TZ: Asia/Kolkata
    volumes: ["vaani-data:/srv/data"]
    depends_on: [dashboard]
  dashboard:
    build: .
    command: ["uvicorn", "sample_dashboard.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports: ["9000:9000"]
    environment:
      DASHBOARD_API_KEY: demo-key-123
      TZ: Asia/Kolkata
volumes:
  vaani-data:
